version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=sqlite:///./planning_assistant.db
    volumes:
      - ../backend/src:/app/src
      - backend-data:/app/data
    networks:
      - planning-network

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - planning-network

volumes:
  backend-data:

networks:
  planning-network:
    driver: bridge
